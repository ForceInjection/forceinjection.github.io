<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  <!-- Fonts: JetBrains Mono (code) via jsdelivr @fontsource — Google Fonts is unreliable in China -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.5/400-italic.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.5/700.css">

  <!-- MathJax 3: lazy-loaded only when the page contains math delimiters -->
  <script>
  (function () {
    // Runs on DOMContentLoaded — in <head> the body isn't parsed yet.
    document.addEventListener('DOMContentLoaded', function () {
      if (!/\$\$|\\\(|\\\[/.test(document.body.textContent)) return;
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          tags: 'ams'
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js';
      s.async = true;
      document.head.appendChild(s);
    });
  }());
  </script>

  <!-- Mermaid: lazy-loaded only when the page contains mermaid code blocks (dark theme) -->
  <script>
  (function () {
    document.addEventListener('DOMContentLoaded', function () {
      if (!document.querySelector('pre code.language-mermaid')) return;
      import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(function (m) {
        var mermaid = m.default;
        mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { background: '#161b22' } });
        // Kramdown renders ```mermaid as <pre><code class="language-mermaid">,
        // but Mermaid expects <div class="mermaid">. Convert them here.
        document.querySelectorAll('pre code.language-mermaid').forEach(function (el) {
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = el.textContent;
          el.parentElement.replaceWith(div);
        });
        mermaid.run();
      });
    });
  }());
  </script>
  <!-- Favicon: based on ForceInjection GitHub avatar -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
</head>
